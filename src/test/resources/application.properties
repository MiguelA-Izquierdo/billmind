spring.application.name=billmind
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Base de Datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.host=${DB_HOST:localhost}
spring.datasource.port=${DB_PORT:5432}
spring.datasource.database=${DB_NAME:testdb}
spring.datasource.username=${DB_USERNAME:test}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Rate limiting — mirrors the profiles in the main application.properties so @SpringBootTest
# contexts satisfy RateLimitProperties' fail-fast validation (this test file shadows the main one).
billmind.ratelimit.store=caffeine
billmind.ratelimit.profiles.upload.capacity=5
billmind.ratelimit.profiles.upload.refill-tokens=5
billmind.ratelimit.profiles.upload.refill-period=PT1H
billmind.ratelimit.profiles.upload.cost=5
billmind.ratelimit.profiles.upload.overrides.ip.capacity=10
billmind.ratelimit.profiles.upload.overrides.ip.refill-tokens=10
billmind.ratelimit.profiles.upload.overrides.ip.refill-period=PT1H
billmind.ratelimit.profiles.upload.overrides.ip.cost=1
billmind.ratelimit.profiles.chat.capacity=20
billmind.ratelimit.profiles.chat.refill-tokens=20
billmind.ratelimit.profiles.chat.refill-period=PT1M
billmind.ratelimit.profiles.chat.overrides.ip.capacity=60
billmind.ratelimit.profiles.chat.overrides.ip.refill-tokens=60
billmind.ratelimit.profiles.chat.overrides.ip.refill-period=PT1M
billmind.ratelimit.profiles.chat.overrides.ip.cost=1
billmind.ratelimit.profiles.admin.capacity=5
billmind.ratelimit.profiles.admin.refill-tokens=5
billmind.ratelimit.profiles.admin.refill-period=PT1M
billmind.ratelimit.profiles.public-read.capacity=60
billmind.ratelimit.profiles.public-read.refill-tokens=60
billmind.ratelimit.profiles.public-read.refill-period=PT1M
billmind.ratelimit.profiles.default.capacity=30
billmind.ratelimit.profiles.default.refill-tokens=30
billmind.ratelimit.profiles.default.refill-period=PT1M
billmind.ratelimit.profiles.default.overrides.ip.capacity=60
billmind.ratelimit.profiles.default.overrides.ip.refill-tokens=60
billmind.ratelimit.profiles.default.overrides.ip.refill-period=PT1M
billmind.ratelimit.profiles.default.overrides.ip.cost=1

# Knowledge
knowledge.seed.enabled=false
knowledge.search.default-max-results=${KNOWLEDGE_SEARCH_MAX_RESULTS:5}
knowledge.search.min-vector-score=${KNOWLEDGE_SEARCH_MIN_VECTOR_SCORE:0.3}

# LLM provider (used by ChatModelRolesConfig to build TimedChatLanguageModel tags)
llm.provider=${LLM_PROVIDER:ollama}
llm.ollama.model=${OLLAMA_CHAT_MODEL:llama3.2}
llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
llm.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:240}

# Ollama (Spring AI embedding — separate from LangChain4j)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:all-minilm}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:llama2}

# PgVector (LangChain4j — used by LangChain4jConfig)
pgvector.table-name=${PGVECTOR_TABLE_NAME:vector_store}
pgvector.dimensions=${PGVECTOR_DIMENSIONS:384}

# External auth service
app.auth.external-url=${AUTH_EXTERNAL_URL:http://localhost:8081}

# Kafka
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=billmind-market
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.izquierdo.billmind.*
kafka.topics.electricity-price-updated=market.electricity-price-updated
kafka.topics.electricity-price-updated-dlt=market.electricity-price-updated.DLT
kafka.topics.electricity-price-domain-errors=market.electricity-price-updated.domain-errors
