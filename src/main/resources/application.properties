spring.application.name=billmind
cors.allowed.origin=${CORS_ALLOWED_ORIGIN}
# 1. Configuracion de la Base de Datos (PostgreSQL + pgvector)
spring.datasource.url=${DB_URL}
spring.datasource.host=${DB_HOST}
spring.datasource.port=${DB_PORT}
spring.datasource.database=${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.dev.izquierdo.billmind=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 3. LLM Provider — ollama | openai | anthropic | gemini | groq
llm.provider=${LLM_PROVIDER:ollama}

# Ollama (local — default)
llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
llm.ollama.model=${OLLAMA_CHAT_MODEL:llama3.2}
llm.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:240}

# OpenAI (GPT)
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=${OPENAI_MODEL:gpt-4o}

# Anthropic (Claude)
llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}

# Google Gemini (AI Studio)
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-1.5-pro}

# Groq (OpenAI-compatible endpoint)
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# 4. Configuracion del Vector Store (Almacen de vectores)
spring.ai.vectorstore.pgvector.table-name=${PGVECTOR_TABLE_NAME}
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS}
spring.ai.vectorstore.pgvector.index-type=${PGVECTOR_INDEX_TYPE}
# ---------------------------------------------------------
# Configuracion de Seguridad JWT
# ---------------------------------------------------------
spring.jwt.secret=${JWT_SECRET}
spring.jwt.expiration=${JWT_EXPIRATION}
# ---------------------------------------------------------
# Actuator / Health
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.diskspace.enabled=true