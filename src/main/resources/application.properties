spring.application.name=billmind
spring.threads.virtual.enabled=true
cors.allowed.origin=${CORS_ALLOWED_ORIGIN}
# 1. Configuracion de la Base de Datos (PostgreSQL + pgvector)
spring.datasource.url=${DB_URL}
spring.datasource.host=${DB_HOST}
spring.datasource.port=${DB_PORT}
spring.datasource.database=${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. Configuracion de JPA / Hibernate
# ddl-auto is externalized so production can lock it down (validate/none) without a code change.
# TODO(first-release): introduce Flyway and switch the production default to `validate`.
# Until then `update` remains the dev/pre-release default. NEVER deploy `update` to production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=ERROR
logging.level.dev.izquierdo.billmind=INFO
logging.level.dev.izquierdo.billmind._shared.infrastructure.adapter.ExternalAuthAdapter=DEBUG
# Agentic assistant: tool dispatch arguments + final answer text (invoice figures may appear here).
logging.level.dev.izquierdo.billmind.assistant.infrastructure.adapter=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 3. LLM Provider - ollama | openai | anthropic | gemini | groq
#
# Single provider for all roles in dev. In production, fastChatModel and smartChatModel
# can be independently routed to different providers by replacing ChatModelRolesConfig
# with provider-specific beans using llm.role.fast.* and llm.role.smart.* properties.
#
# Role assignment:
#   fastChatModel  \u2192 classification, PII redaction (latency-sensitive, cheaper model OK)
#   smartChatModel \u2192 field extraction, RAG, agent reasoning (quality-sensitive)
llm.provider=${LLM_PROVIDER:ollama}

# Ollama (local - default)
llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
llm.ollama.model=${OLLAMA_CHAT_MODEL:llama3.2}
llm.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:240}

# OpenAI (GPT)
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=${OPENAI_MODEL:gpt-4o}

# Anthropic (Claude)
llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}

# Google Gemini (AI Studio)
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Groq (OpenAI-compatible endpoint)
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# 4. Vector Store (PgVector - LangChain4j)
pgvector.table-name=${PGVECTOR_TABLE_NAME:vector_store}
pgvector.dimensions=${PGVECTOR_DIMENSIONS:384}
# langchain4j-pgvector:1.0.0-beta5 supports IVFFlat only. Set false to skip index creation.
pgvector.use-index=${PGVECTOR_USE_INDEX:true}
# IVFFlat `lists` parameter - number of inverted lists. sqrt(rows) is a common baseline; 100 is a safe default for small datasets.
pgvector.index-list-size=${PGVECTOR_INDEX_LIST_SIZE:100}
# ---------------------------------------------------------
# Servicio externo de autenticacion
# ---------------------------------------------------------
app.auth.external-url=${AUTH_EXTERNAL_URL:http://localhost:8081}
# ---------------------------------------------------------
# Kafka
# ---------------------------------------------------------
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Consumer - market price group
spring.kafka.consumer.group-id=billmind-market
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.izquierdo.billmind.*

# Topics
kafka.topics.electricity-price-updated=market.electricity-price-updated
kafka.topics.electricity-price-updated-dlt=market.electricity-price-updated.DLT
kafka.topics.electricity-price-domain-errors=market.electricity-price-updated.domain-errors
kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:1}

# ---------------------------------------------------------
# Actuator / Health
# ---------------------------------------------------------
# ---------------------------------------------------------
# Embedding Model - allminilm (local ONNX, 384d) | openai (remote) | ollama (local server)
# ---------------------------------------------------------
embedding.provider=${EMBEDDING_PROVIDER:allminilm}
embedding.openai.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
embedding.ollama.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
embedding.ollama.timeout-seconds=${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:120}

# ---------------------------------------------------------
# Assistant - in-memory conversation store (Phase 1)
# ---------------------------------------------------------
# Hard cap on stored conversations; least-recently-accessed are evicted first.
assistant.conversation.max-size=${ASSISTANT_CONVERSATION_MAX_SIZE:1000}
# Sliding TTL (ISO-8601 duration) refreshed on each read/write; idle conversations expire.
assistant.conversation.ttl=${ASSISTANT_CONVERSATION_TTL:PT2H}
# Agentic tool calling: ON -> AgenticAssistantLlmAdapter (LLM pulls context via tools);
# OFF (default) -> LlmAssistantAdapter (eager context). Requires a tool-capable smartChatModel.
assistant.tools.enabled=${ASSISTANT_TOOLS_ENABLED:false}

# ---------------------------------------------------------
# Knowledge Base
# ---------------------------------------------------------
knowledge.seed.enabled=${KNOWLEDGE_SEED_ENABLED:true}
knowledge.chunk.size=${KNOWLEDGE_CHUNK_SIZE:150}
knowledge.chunk.overlap=${KNOWLEDGE_CHUNK_OVERLAP:30}
knowledge.search.default-max-results=${KNOWLEDGE_SEARCH_MAX_RESULTS:5}
knowledge.search.min-vector-score=${KNOWLEDGE_SEARCH_MIN_VECTOR_SCORE:0.72}

# Actuator runs on a separate, internal-only management port so it can be
# network-isolated in production (never routed by the public reverse proxy / Ingress).
# The SessionFilter and SecurityFilterChain are bound to the application port, not this
# one. Override MANAGEMENT_PORT per environment; locally Actuator lives at :8083.
management.server.port=${MANAGEMENT_PORT:8083}
# metrics + prometheus surface the custom Micrometer instruments (pii.llm.*, invoice.*)
# on the internal management port only — never routed by the public proxy.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.diskspace.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,kafka,diskSpace

# ---------------------------------------------------------
# LLM observability (Milestone 6)
# Per-call telemetry is emitted by TimedChatLanguageModel into independently toggled sinks.
#  - metrics: Micrometer meters (llm.call.duration, llm.calls, llm.tokens, llm.cost.usd) on the
#    Actuator /metrics + /prometheus endpoints (management port). On by default.
#  - tracing: one OTLP span per call, exported to an external Langfuse backend. Off by default —
#    needs a tool-capable deployment and LANGFUSE_HOST + project keys. Both are safe to run at once.
billmind.observability.llm.metrics.enabled=${LLM_METRICS_ENABLED:true}
billmind.observability.llm.tracing.enabled=${LLM_TRACING_ENABLED:false}
billmind.observability.llm.tracing.langfuse-host=${LANGFUSE_HOST:}
billmind.observability.llm.tracing.public-key=${LANGFUSE_PUBLIC_KEY:}
billmind.observability.llm.tracing.secret-key=${LANGFUSE_SECRET_KEY:}