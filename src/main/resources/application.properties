spring.application.name=billmind
spring.threads.virtual.enabled=true
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}
# 1. Configuracion de la Base de Datos (PostgreSQL + pgvector)
spring.datasource.url=${DB_URL}
spring.datasource.host=${DB_HOST}
spring.datasource.port=${DB_PORT}
spring.datasource.database=${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. Configuracion de JPA / Hibernate
# The schema is owned by Flyway (see section below), so Hibernate only validates by default.
# ddl-auto stays externalized as an escape hatch (e.g. DDL_AUTO=none), but NEVER set it to
# `update`/`create` against a Flyway-managed database — the two would fight over the schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 2b. Flyway — schema migrations (src/main/resources/db/migration)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Adopt Flyway on a schema that already exists (created by the old ddl-auto=update): when there is
# no flyway_schema_history table, Flyway stamps the DB at baseline-version and then runs migrations
# ABOVE it. baseline-version=0 keeps V1 in scope, and V1 is idempotent (CREATE ... IF NOT EXISTS),
# so it is a safe no-op on an already-populated dev DB and the authoritative creator on a fresh one.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Logging
logging.level.root=ERROR
logging.level.dev.izquierdo.billmind=INFO
# Assistant adapter logs at INFO in the default (production) profile: DEBUG there emits tool
# dispatch arguments and final answer text, which can contain invoice figures — see CLAUDE.md
# Security rule 6. Raise to DEBUG only under a local dev profile, never here.
logging.level.dev.izquierdo.billmind.assistant.infrastructure.adapter=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 3. LLM Provider - ollama | openai | anthropic | gemini | groq
#
# Role assignment:
#   fastChatModel  \u2192 classification, PII redaction (latency-sensitive, cheaper model OK)
#   smartChatModel \u2192 field extraction, RAG, agent reasoning (quality-sensitive)
#
# Each role can run a different model on this provider \u2014 see llm.role.* below. Routing the
# roles to different *providers* is a separate change \u2014 see docs/PLAN.md.
llm.provider=${LLM_PROVIDER:ollama}

# Ollama (local - default)
llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
llm.ollama.model=${OLLAMA_CHAT_MODEL:llama3.2}
llm.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:240}

# OpenAI (GPT)
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=${OPENAI_MODEL:gpt-4o}

# Anthropic (Claude)
llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}

# Google Gemini (AI Studio)
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Groq (OpenAI-compatible endpoint)
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# Model per role - optional, valid for any provider (e.g. fast=openai/gpt-oss-20b,
# smart=openai/gpt-oss-120b). Unset, both roles fall back to the active provider's
# model above, which is what the nested default resolves to.
llm.role.fast.model=${LLM_ROLE_FAST_MODEL:${llm.${llm.provider}.model}}
llm.role.smart.model=${LLM_ROLE_SMART_MODEL:${llm.${llm.provider}.model}}

# The output ceiling is not a property: it is decided per role in ChatModelRolesConfig, because
# what sets it is the longest answer the code asks for, not the environment it runs in.

# 4. Vector Store (PgVector - LangChain4j)
pgvector.table-name=${PGVECTOR_TABLE_NAME:vector_store}
pgvector.dimensions=${PGVECTOR_DIMENSIONS:384}
# The IVFFlat index is NOT built by the store: LangChain4jConfig hardcodes useIndex=false, and
# JpaKnowledgeRepository.rebuildIndex() owns the index lifecycle (DROP/CREATE with lists=sqrt(rows),
# skipped below 100 vectors). See docs/ARCHITECTURE.md — Design Decision #3.
# ---------------------------------------------------------
# Servicio externo de autenticacion
# ---------------------------------------------------------
app.auth.external-url=${AUTH_EXTERNAL_URL:http://localhost:8081}
# ---------------------------------------------------------
# Kafka
# ---------------------------------------------------------
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Consumer - market price group
spring.kafka.consumer.group-id=billmind-market
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.izquierdo.billmind.*

# Topics
kafka.topics.electricity-price-updated=market.electricity-price-updated
kafka.topics.electricity-price-updated-dlt=market.electricity-price-updated.DLT
kafka.topics.electricity-price-domain-errors=market.electricity-price-updated.domain-errors
kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:1}

# ---------------------------------------------------------
# Actuator / Health
# ---------------------------------------------------------
# ---------------------------------------------------------
# Embedding Model - allminilm (local ONNX, 384d) | openai (remote) | ollama (local server)
# ---------------------------------------------------------
embedding.provider=${EMBEDDING_PROVIDER:allminilm}
embedding.openai.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
embedding.ollama.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
embedding.ollama.timeout-seconds=${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:120}

# ---------------------------------------------------------
# Assistant - in-memory conversation store (Phase 1)
# ---------------------------------------------------------
# Hard cap on stored conversations; least-recently-accessed are evicted first.
assistant.conversation.max-size=${ASSISTANT_CONVERSATION_MAX_SIZE:1000}
# Sliding TTL (ISO-8601 duration) refreshed on each read/write; idle conversations expire.
assistant.conversation.ttl=${ASSISTANT_CONVERSATION_TTL:PT2H}
# Agentic tool calling: ON -> AgenticAssistantLlmAdapter (LLM pulls context via tools);
# OFF (default) -> LlmAssistantAdapter (eager context). Requires a tool-capable smartChatModel.
assistant.tools.enabled=${ASSISTANT_TOOLS_ENABLED:false}
# Cache for argument-deterministic tool results (search_regulation). Write-based TTL (ISO-8601)
# bounds staleness after a knowledge-base change; size caps in-memory growth. Caffeine today,
# Redis-backed later behind the same ToolResultCache interface.
assistant.tools.cache.ttl=${ASSISTANT_TOOLS_CACHE_TTL:PT2H}
assistant.tools.cache.max-size=${ASSISTANT_TOOLS_CACHE_MAX_SIZE:500}

# ---------------------------------------------------------
# Rate limiting — per-endpoint token buckets (bucket4j + Caffeine). Closes security debt A04;
# Redis-backed global limits land in Milestone 9. See docs/RATELIMIT.md.
# ---------------------------------------------------------
# Storage backend for the token buckets. 'caffeine' = in-process, per-instance (Phase 1).
# 'redis' (Lettuce) later shares buckets across instances behind the same RateLimitStore port.
billmind.ratelimit.store=${RATELIMIT_STORE:caffeine}
# Honour X-Forwarded-For for the client IP. Enable ONLY behind a trusted proxy that overwrites it;
# otherwise the header is attacker-spoofable and the IP limit can be bypassed.
billmind.ratelimit.trust-forwarded-for=${RATELIMIT_TRUST_FORWARDED_FOR:false}
# Caffeine backend bounds: max distinct keys held, and how long an idle bucket survives.
billmind.ratelimit.caffeine.max-size=${RATELIMIT_CAFFEINE_MAX_SIZE:50000}
billmind.ratelimit.caffeine.expire-after=${RATELIMIT_CAFFEINE_EXPIRE_AFTER:PT1H}
# Per-profile token buckets: capacity, refill (tokens per ISO-8601 period), cost per request.
# Starting points — tune from metrics once live. NONE is unlimited and needs no entry.
#
# UPLOAD and CHAT are counted twice: against the caller's session AND against their IP.
# `overrides.ip.*` is the ceiling — X-Session-Id is self-asserted, so the session bucket alone
# is bypassed by rotating the header. Size the IP bucket so no real visitor (NAT/CGNAT included)
# ever reaches it, and an attacker rotating sessions still cannot loop the paid LLM routes.
#
# UPLOAD — LLM extraction, paid: small burst, slow sustained rate; each upload costs 5 tokens.
# 15 capacity / 5 cost = 3 invoices per session: a visitor compares the bill they arrived with and
# still has room for the two they went to fetch. Greedy refill, so the fourth unblocks in 20 min
# rather than on the hour.
billmind.ratelimit.profiles.upload.capacity=${RATELIMIT_UPLOAD_CAPACITY:15}
billmind.ratelimit.profiles.upload.refill-tokens=${RATELIMIT_UPLOAD_REFILL:15}
billmind.ratelimit.profiles.upload.refill-period=${RATELIMIT_UPLOAD_PERIOD:PT1H}
billmind.ratelimit.profiles.upload.cost=${RATELIMIT_UPLOAD_COST:5}
# UPLOAD ceiling — 30 uploads/h per IP, an order of magnitude above the session share so a shared
# CGNAT egress still fits ~10 honest visitors; a session-rotating attacker is capped here.
billmind.ratelimit.profiles.upload.overrides.ip.capacity=${RATELIMIT_UPLOAD_IP_CAPACITY:30}
billmind.ratelimit.profiles.upload.overrides.ip.refill-tokens=${RATELIMIT_UPLOAD_IP_REFILL:30}
billmind.ratelimit.profiles.upload.overrides.ip.refill-period=${RATELIMIT_UPLOAD_IP_PERIOD:PT1H}
billmind.ratelimit.profiles.upload.overrides.ip.cost=${RATELIMIT_UPLOAD_IP_COST:1}
# CHAT — RAG + streaming LLM: high-frequency happy path.
billmind.ratelimit.profiles.chat.capacity=${RATELIMIT_CHAT_CAPACITY:20}
billmind.ratelimit.profiles.chat.refill-tokens=${RATELIMIT_CHAT_REFILL:20}
billmind.ratelimit.profiles.chat.refill-period=${RATELIMIT_CHAT_PERIOD:PT1M}
billmind.ratelimit.profiles.chat.cost=${RATELIMIT_CHAT_COST:1}
# CHAT ceiling — 60 msg/min per IP, i.e. three sessions chatting flat out at their own limit.
billmind.ratelimit.profiles.chat.overrides.ip.capacity=${RATELIMIT_CHAT_IP_CAPACITY:60}
billmind.ratelimit.profiles.chat.overrides.ip.refill-tokens=${RATELIMIT_CHAT_IP_REFILL:60}
billmind.ratelimit.profiles.chat.overrides.ip.refill-period=${RATELIMIT_CHAT_IP_PERIOD:PT1M}
billmind.ratelimit.profiles.chat.overrides.ip.cost=${RATELIMIT_CHAT_IP_COST:1}
# ADMIN — brute-force sensitive, same numbers on both the IP and token layers.
billmind.ratelimit.profiles.admin.capacity=${RATELIMIT_ADMIN_CAPACITY:5}
billmind.ratelimit.profiles.admin.refill-tokens=${RATELIMIT_ADMIN_REFILL:5}
billmind.ratelimit.profiles.admin.refill-period=${RATELIMIT_ADMIN_PERIOD:PT1M}
billmind.ratelimit.profiles.admin.cost=${RATELIMIT_ADMIN_COST:1}
# ADMIN_READ — admin GETs (rate listing, KB search). Wider than ADMIN because reloading a page by
# hand is not an attack and nothing here changes state; ADMIN's 5/min stays where it matters.
billmind.ratelimit.profiles.admin-read.capacity=${RATELIMIT_ADMIN_READ_CAPACITY:30}
billmind.ratelimit.profiles.admin-read.refill-tokens=${RATELIMIT_ADMIN_READ_REFILL:30}
billmind.ratelimit.profiles.admin-read.refill-period=${RATELIMIT_ADMIN_READ_PERIOD:PT1M}
billmind.ratelimit.profiles.admin-read.cost=${RATELIMIT_ADMIN_READ_COST:1}
# PUBLIC_READ — cheap reads, no LLM.
billmind.ratelimit.profiles.public-read.capacity=${RATELIMIT_PUBLIC_READ_CAPACITY:60}
billmind.ratelimit.profiles.public-read.refill-tokens=${RATELIMIT_PUBLIC_READ_REFILL:60}
billmind.ratelimit.profiles.public-read.refill-period=${RATELIMIT_PUBLIC_READ_PERIOD:PT1M}
billmind.ratelimit.profiles.public-read.cost=${RATELIMIT_PUBLIC_READ_COST:1}
# DEFAULT — safe fallback for any unmapped /api/v1/ route. Carries the same IP ceiling as the
# paid routes: an unmapped route is one nobody has reasoned about, so it must not be guarded by a
# header the caller writes themselves.
billmind.ratelimit.profiles.default.capacity=${RATELIMIT_DEFAULT_CAPACITY:30}
billmind.ratelimit.profiles.default.refill-tokens=${RATELIMIT_DEFAULT_REFILL:30}
billmind.ratelimit.profiles.default.refill-period=${RATELIMIT_DEFAULT_PERIOD:PT1M}
billmind.ratelimit.profiles.default.cost=${RATELIMIT_DEFAULT_COST:1}
billmind.ratelimit.profiles.default.overrides.ip.capacity=${RATELIMIT_DEFAULT_IP_CAPACITY:60}
billmind.ratelimit.profiles.default.overrides.ip.refill-tokens=${RATELIMIT_DEFAULT_IP_REFILL:60}
billmind.ratelimit.profiles.default.overrides.ip.refill-period=${RATELIMIT_DEFAULT_IP_PERIOD:PT1M}
billmind.ratelimit.profiles.default.overrides.ip.cost=${RATELIMIT_DEFAULT_IP_COST:1}

# ---------------------------------------------------------
# Knowledge Base
# ---------------------------------------------------------
knowledge.seed.enabled=${KNOWLEDGE_SEED_ENABLED:true}
knowledge.chunk.size=${KNOWLEDGE_CHUNK_SIZE:150}
knowledge.chunk.overlap=${KNOWLEDGE_CHUNK_OVERLAP:30}
knowledge.search.default-max-results=${KNOWLEDGE_SEARCH_MAX_RESULTS:5}
knowledge.search.min-vector-score=${KNOWLEDGE_SEARCH_MIN_VECTOR_SCORE:0.72}

# ---------------------------------------------------------
# Comparison
# ---------------------------------------------------------
# Example offers served only while electricity_rates is empty, so a fresh clone can run the
# savings comparison without a Kafka producer. Read-only — never written to the database.
comparison.fallback-offers.enabled=${COMPARISON_FALLBACK_OFFERS_ENABLED:true}

# Actuator runs on a separate, internal-only management port so it can be
# network-isolated in production (never routed by the public reverse proxy / Ingress).
# The SessionFilter and SecurityFilterChain are bound to the application port, not this
# one. Override MANAGEMENT_PORT per environment; locally Actuator lives at :8083.
management.server.port=${MANAGEMENT_PORT:8083}
# metrics + prometheus surface the custom Micrometer instruments (pii.llm.*, invoice.*)
# on the internal management port only — never routed by the public proxy.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.diskspace.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,kafka,diskSpace

# ---------------------------------------------------------
# LLM observability (Milestone 6)
# Per-call telemetry is emitted by TimedChatLanguageModel into independently toggled sinks.
#  - metrics: Micrometer meters (llm.call.duration, llm.calls, llm.tokens, llm.cost.usd) on the
#    Actuator /metrics + /prometheus endpoints (management port). On by default.
#  - tracing: one OTLP span per call, exported to an external Langfuse backend. Off by default —
#    needs a tool-capable deployment and LANGFUSE_HOST + project keys. Both are safe to run at once.
billmind.observability.llm.metrics.enabled=${LLM_METRICS_ENABLED:true}
billmind.observability.llm.tracing.enabled=${LLM_TRACING_ENABLED:false}
billmind.observability.llm.tracing.langfuse-host=${LANGFUSE_HOST:}
billmind.observability.llm.tracing.public-key=${LANGFUSE_PUBLIC_KEY:}
billmind.observability.llm.tracing.secret-key=${LANGFUSE_SECRET_KEY:}