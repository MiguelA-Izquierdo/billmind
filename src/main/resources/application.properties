spring.application.name=billmind
cors.allowed.origin=${CORS_ALLOWED_ORIGIN}
# 1. Configuracion de la Base de Datos (PostgreSQL + pgvector)
spring.datasource.url=${DB_URL}
spring.datasource.host=${DB_HOST}
spring.datasource.port=${DB_PORT}
spring.datasource.database=${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.demo.billmind=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 3. Configuracion de Spring AI - Ollama (El Cerebro)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL}
# 4. Configuracion del Vector Store (Almacen de vectores)
spring.ai.vectorstore.pgvector.table-name=${PGVECTOR_TABLE_NAME}
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS}
spring.ai.vectorstore.pgvector.index-type=${PGVECTOR_INDEX_TYPE}
# ---------------------------------------------------------
# Configuracion de Seguridad JWT
# ---------------------------------------------------------
spring.jwt.secret=${JWT_SECRET}
spring.jwt.expiration=${JWT_EXPIRATION}
# ---------------------------------------------------------
# Actuator / Health
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.diskspace.enabled=true