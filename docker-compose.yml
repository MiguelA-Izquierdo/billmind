services:

  # ── Infrastructure (always started) ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: billmind-postgres
    environment:
      POSTGRES_DB: billmind
      POSTGRES_USER: billmind
      POSTGRES_PASSWORD: billmind
    ports:
      - "5432:5432"
    volumes:
      - billmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billmind -d billmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local AI (profile: local-ai) ─────────────────────────────────────────────
  # Start with: docker-compose --profile local-ai up -d
  # Required when LLM_PROVIDER=ollama

  ollama:
    image: ollama/ollama:latest
    container_name: billmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    profiles:
      - local-ai

  # ── Kafka (profile: kafka) ────────────────────────────────────────────────────
  # Start with: docker-compose --profile kafka up -d
  # Required when KAFKA_ENABLED=true (market price consumer)

  kafka:
    image: apache/kafka:3.9.0
    container_name: billmind-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - kafka

  # Pulls the minimum required models on first start.
  # all-minilm  — embeddings (always required when using Ollama for vectors)
  # llama3.2    — chat/classification (required when LLM_PROVIDER=ollama)
  ollama-setup:
    image: ollama/ollama:latest
    container_name: billmind-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo 'Pulling all-minilm (embeddings)...' &&
        ollama pull all-minilm &&
        echo 'Pulling llama3.2 (chat)...' &&
        ollama pull llama3.2 &&
        echo 'Models ready.'
      "
    restart: "no"
    profiles:
      - local-ai

volumes:
  billmind_pgdata:
  ollama_data: