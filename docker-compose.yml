services:

  # ── Infrastructure (always started) ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: billmind-postgres
    environment:
      POSTGRES_DB: billmind
      POSTGRES_USER: billmind
      POSTGRES_PASSWORD: billmind
    ports:
      - "5432:5432"
    volumes:
      - billmind_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billmind -d billmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local AI (profile: local-ai) ─────────────────────────────────────────────
  # Start with: docker-compose --profile local-ai up -d
  # Required when LLM_PROVIDER=ollama

  ollama:
    image: ollama/ollama:latest
    container_name: billmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    profiles:
      - local-ai

  # ── Kafka (profile: kafka) ────────────────────────────────────────────────────
  # Start with: docker-compose --profile kafka up -d
  # Required when KAFKA_ENABLED=true (market price consumer)

  kafka:
    image: apache/kafka:3.9.0
    container_name: billmind-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - kafka

  # Pulls the chat model on first start.
  # llama3.2  — chat/classification (required when LLM_PROVIDER=ollama)
  # Embeddings (AllMiniLM-L6-v2) run via ONNX inside the app container — Ollama is not needed for vector search.
  ollama-setup:
    image: ollama/ollama:latest
    container_name: billmind-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo 'Pulling llama3.2 (chat)...' &&
        ollama pull llama3.2 &&
        echo 'Models ready.'
      "
    restart: "no"
    profiles:
      - local-ai

  # ── Application ──────────────────────────────────────────────────────────────
  # Default profile: postgres only. Add --profile local-ai to also start Ollama.
  # Override LLM_PROVIDER and the corresponding API key env var for cloud providers.

  app:
    build: .
    container_name: billmind-app
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      # Actuator on a separate, internal-only port — intentionally NOT published
      # under `ports:` so it stays unreachable from the host / public network.
      MANAGEMENT_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/billmind
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: billmind
      DB_USERNAME: billmind
      DB_PASSWORD: billmind
      CORS_ALLOWED_ORIGIN: "http://localhost:8082"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2
      OLLAMA_TIMEOUT_SECONDS: 240
      PGVECTOR_TABLE_NAME: vector_store
      PGVECTOR_DIMENSIONS: 384
      PGVECTOR_USE_INDEX: "true"
      PGVECTOR_INDEX_LIST_SIZE: 100
      KAFKA_ENABLED: "${KAFKA_ENABLED:-false}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PARTITIONS: 3
      KAFKA_TOPIC_REPLICAS: 1
    healthcheck:
      # Liveness probe on the internal management port — reflects only livenessState,
      # so it stays green regardless of Kafka being disabled or the DB being transiently down.
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous start period: Spring Boot startup + ONNX embedding model load.
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

volumes:
  billmind_pgdata:
  ollama_data: